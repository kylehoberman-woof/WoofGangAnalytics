<!DOCTYPE html>
<html lang="en">
<head>
<script>if(sessionStorage.getItem('wg_portal_auth')!=='1')window.location.href='index.html';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woof Gang — Store Supplies</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#FDF0F5;min-height:100vh;color:#1a1a2e}
.header{background:linear-gradient(135deg,#C4276E 0%,#6B3520 100%);padding:36px 32px 32px;text-align:center;color:white;position:relative}
.back-link{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.85);text-decoration:none;font-size:0.82rem;font-weight:700;background:rgba(255,255,255,0.15);padding:7px 14px;border-radius:8px;transition:background 0.2s}
.back-link:hover{background:rgba(255,255,255,0.28)}
.header h1{font-size:1.8rem;font-weight:800;margin-bottom:4px;letter-spacing:-0.02em}
.header p{font-size:0.9rem;opacity:0.85}
.brand{display:inline-block;margin-top:10px;background:rgba(255,255,255,0.15);padding:3px 14px;border-radius:20px;font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase}
.main{max-width:1200px;margin:0 auto;padding:32px 24px 60px}

.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:0.72rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:0.04em}
.fg input,.fg select,.fg textarea{padding:9px 11px;border:2px solid #ddd;border-radius:8px;font-family:inherit;font-size:0.9rem;color:#1a1a2e;transition:border-color 0.2s;background:white}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#C4276E;box-shadow:0 0 0 3px rgba(196,39,110,0.08)}
.btn-primary{padding:11px 28px;background:#C4276E;color:white;border:none;border-radius:8px;font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer;transition:all 0.2s;margin-top:8px}
.btn-primary:hover{background:#a31f5b;transform:translateY(-1px)}
.btn-primary:disabled{background:#ccc;cursor:not-allowed;transform:none}
.btn-secondary{padding:8px 18px;background:white;color:#666;border:2px solid #ddd;border-radius:8px;font-family:inherit;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-secondary:hover{border-color:#C4276E;color:#C4276E}

/* Summary */
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:16px;margin-bottom:24px}
.sc{background:white;border-radius:12px;padding:18px 14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center;border-top:4px solid #C4276E}
.sc:nth-child(2){border-top-color:#2E7D32}.sc:nth-child(3){border-top-color:#F9A825}.sc:nth-child(4){border-top-color:#c62828}
.sc-val{font-size:2.2rem;font-weight:800;color:#C4276E;line-height:1}
.sc:nth-child(2) .sc-val{color:#2E7D32}.sc:nth-child(3) .sc-val{color:#F9A825}.sc:nth-child(4) .sc-val{color:#c62828}
.sc-label{font-size:0.73rem;font-weight:700;color:#888;margin-top:5px;text-transform:uppercase;letter-spacing:0.04em}

/* Toolbar */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;background:white;border-radius:12px;padding:14px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-sel{padding:7px 11px;border:2px solid #ddd;border-radius:8px;font-family:inherit;font-size:0.82rem;color:#1a1a2e;cursor:pointer;background:white;-webkit-appearance:none}
.filter-sel:focus{outline:none;border-color:#C4276E}
.toolbar-actions{display:flex;gap:8px;align-items:center}
.btn-add{padding:8px 16px;background:#2E7D32;color:white;border:none;border-radius:8px;font-family:inherit;font-size:0.82rem;font-weight:700;cursor:pointer;transition:background 0.2s}
.btn-add:hover{background:#1b5e20}

/* Items grid */
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.item-card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border-left:4px solid #ddd;transition:transform 0.15s,box-shadow 0.15s}
.item-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.08)}
.item-card.status-ok{border-left-color:#2E7D32}
.item-card.status-low{border-left-color:#F9A825}
.item-card.status-order{border-left-color:#c62828}
.item-card.status-out{border-left-color:#c62828;background:#fff8f8}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.item-name{font-size:1rem;font-weight:700;color:#1a1a2e;line-height:1.3}
.status-chip{font-size:0.68rem;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap}
.chip-ok{background:#e8f5e9;color:#2E7D32}
.chip-low{background:#fff8e1;color:#b8880a}
.chip-order{background:#fce4ec;color:#c62828}
.chip-out{background:#c62828;color:white}
.item-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:0.69rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
.b-cat{background:#f0f0f0;color:#555}
.b-pw{background:#FDF0F5;color:#C4276E}.b-hv{background:#e0f2f1;color:#1B6B6B}.b-both{background:#efebe9;color:#6B3520}
.qty-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.qty-big{font-size:1.8rem;font-weight:800;color:#1a1a2e;line-height:1}
.qty-unit{font-size:0.8rem;color:#888;font-weight:500;align-self:flex-end;padding-bottom:3px}
.qty-min{font-size:0.78rem;color:#aaa;margin-left:auto;align-self:flex-end}
.qty-bar{height:6px;background:#f0f0f0;border-radius:3px;margin-bottom:12px;overflow:hidden}
.qty-fill{height:100%;border-radius:3px;transition:width 0.3s}
.fill-ok{background:#2E7D32}.fill-low{background:#F9A825}.fill-order{background:#c62828}
.item-meta{font-size:0.78rem;color:#999;margin-bottom:12px}
.item-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{padding:5px 11px;border-radius:6px;font-family:inherit;font-size:0.76rem;font-weight:600;cursor:pointer;transition:all 0.15s;border:1.5px solid #ddd;background:white;color:#555}
.btn-sm:hover{background:#f0f0f0}
.btn-order:hover{background:#fce4ec;color:#c62828;border-color:#e8a0a0}
.edit-qty-row{display:flex;gap:6px;align-items:center;margin-top:8px}
.edit-qty-input{width:70px;padding:6px 8px;border:2px solid #C4276E;border-radius:6px;font-family:inherit;font-size:0.9rem;font-weight:700;text-align:center}
.edit-qty-input:focus{outline:none}
.btn-save{padding:5px 12px;background:#C4276E;color:white;border:none;border-radius:6px;font-family:inherit;font-size:0.76rem;font-weight:700;cursor:pointer}
.btn-cancel{padding:5px 10px;background:white;color:#888;border:1.5px solid #ddd;border-radius:6px;font-family:inherit;font-size:0.76rem;cursor:pointer}

/* Add form */
.add-form-panel{background:white;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.08);margin-bottom:20px}
.add-form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-items:end}
.span-full{grid-column:1/-1}

/* Empty */
.empty{text-align:center;padding:48px 20px;color:#aaa;font-size:0.9rem;line-height:1.8;background:white;border-radius:12px}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;color:white;font-weight:700;font-size:0.88rem;box-shadow:0 4px 16px rgba(0,0,0,0.15);z-index:999;transition:opacity 0.4s;pointer-events:none}
.toast.hidden{opacity:0}.toast.success{background:#2E7D32}.toast.error{background:#c62828}.toast.info{background:#1B6B6B}
.hidden{display:none!important}

@media(max-width:700px){
  .header{padding:24px 16px 20px}
  .back-link{position:static;transform:none;display:inline-block;margin-bottom:10px;font-size:0.75rem}
  .main{padding:20px 12px 40px}
  .items-grid{grid-template-columns:1fr}
  .add-form-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-link" id="portal-back">&#8592; Portal</a><script>!function(){var l=sessionStorage.getItem('wg_portal_level'),a=document.getElementById('portal-back');if(l==='manager'){a.href='manager.html';a.textContent='\u2190 Manager Portal';}else if(l==='store'){a.href='store.html';a.textContent='\u2190 Store Portal';}else{a.textContent='\u2190 Owner Portal';}}();</script>
  <h1>&#129529; Store Supplies</h1>
  <p>Track office, cleaning, and operational supplies across both stores</p>
  <div class="brand">Woof Gang Bakery &amp; Grooming</div>
</div>

<div class="main">

  <div id="dashboard">

    <div class="summary-cards">
      <div class="sc"><div class="sc-val" id="stat-total">–</div><div class="sc-label">Total Items</div></div>
      <div class="sc"><div class="sc-val" id="stat-ok">–</div><div class="sc-label">Well Stocked</div></div>
      <div class="sc"><div class="sc-val" id="stat-low">–</div><div class="sc-label">Low Stock</div></div>
      <div class="sc"><div class="sc-val" id="stat-order">–</div><div class="sc-label">Order Now</div></div>
    </div>

    <!-- Add Item form (collapsible) -->
    <div id="add-panel" class="add-form-panel hidden">
      <div class="card-title" style="margin-bottom:16px">+ Add Supply Item</div>
      <div class="add-form-grid">
        <div class="fg" style="grid-column:span 2">
          <label>Item Name *</label>
          <input type="text" id="a-name" placeholder="e.g. Paper Towels">
        </div>
        <div class="fg">
          <label>Category</label>
          <select id="a-cat">
            <option value="">— None —</option>
            <option value="Cleaning">Cleaning</option>
            <option value="Office">Office</option>
            <option value="Grooming">Grooming Supplies</option>
            <option value="Bag and Packaging">Bag and Packaging</option>
            <option value="Packaging">Packaging</option>
            <option value="Bakery">Bakery</option>
            <option value="Safety">Safety</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="fg">
          <label>Store</label>
          <select id="a-store" required>
            <option value="">— Select Store —</option>
            <option value="port-washington">Port Washington</option>
            <option value="hicksville">Hicksville</option>
          </select>
        </div>
        <div class="fg">
          <label>Current Qty</label>
          <input type="number" id="a-qty" min="0" value="0" step="0.25">
        </div>
        <div class="fg">
          <label>Unit</label>
          <input type="text" id="a-unit" placeholder="rolls, boxes…">
        </div>
        <div class="fg">
          <label>Reorder Level</label>
          <input type="number" id="a-minqty" min="0" value="0" step="0.25">
        </div>
        <div class="fg span-full" style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn-secondary" onclick="toggleAddForm(false)">Cancel</button>
          <button class="btn-primary" onclick="handleAdd()" id="add-btn">+ Add Item</button>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="filters">
        <select class="filter-sel" id="filter-store" onchange="renderItems()">
          <option value="">All Stores</option>
          <option value="port-washington">Port Washington</option>
          <option value="hicksville">Hicksville</option>
        </select>
        <select class="filter-sel" id="filter-cat" onchange="renderItems()">
          <option value="">All Categories</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Office">Office</option>
          <option value="Grooming">Grooming</option>
          <option value="Bag and Packaging">Bag and Packaging</option>
          <option value="Packaging">Packaging</option>
          <option value="Bakery">Bakery</option>
          <option value="Safety">Safety</option>
          <option value="Other">Other</option>
        </select>
        <select class="filter-sel" id="filter-status" onchange="renderItems()">
          <option value="">All Statuses</option>
          <option value="ok">Well Stocked</option>
          <option value="low">Low Stock</option>
          <option value="order">Order Now</option>
          <option value="out">Out of Stock</option>
        </select>
      </div>
      <div class="toolbar-actions">
        <button class="btn-add" onclick="toggleAddForm(true)">+ Add Item</button>
        <button class="btn-secondary" onclick="loadItems()">&#8635; Refresh</button>
      </div>
    </div>

    <div id="items-container"><div class="empty">Loading&hellip;</div></div>

  </div><!-- /dashboard -->
</div><!-- /main -->

<div class="toast hidden" id="toast"></div>

<script>
/* ── Supabase config ─────────────────────────── */
var SB_URL = 'https://bqzinttbjeeaybywhhet.supabase.co/rest/v1';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxemludHRiamVlYXlieXdoaGV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3MDU3NDUsImV4cCI6MjA4OTI4MTc0NX0.B2MqUy_WEWOo8NVpGxHibuh-8xLklsy3Ux4DnXp9zmQ';
var SB_HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

var records = []; // array of Supabase rows

/* ── Toast ────────────────────────────────────── */
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.add('hidden'); }, 2800);
}

/* ── Supabase API ─────────────────────────────── */
function sbFetchAll() {
  return fetch(SB_URL + '/store_supplies?select=*&order=item_name', { headers: SB_HDR })
    .then(function(r) {
      if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
      return r.json();
    });
}
function sbPatch(id, patch) {
  return fetch(SB_URL + '/store_supplies?id=eq.' + encodeURIComponent(id), {
    method: 'PATCH',
    headers: SB_HDR,
    body: JSON.stringify(patch)
  }).then(function(r) {
    if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
    return r.json().then(function(a){ return a[0]; });
  });
}
function sbInsert(row) {
  return fetch(SB_URL + '/store_supplies', {
    method: 'POST',
    headers: SB_HDR,
    body: JSON.stringify(row)
  }).then(function(r) {
    if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
    return r.json().then(function(a){ return a[0]; });
  });
}
function sbDelete(id) {
  return fetch(SB_URL + '/store_supplies?id=eq.' + encodeURIComponent(id), {
    method: 'DELETE',
    headers: SB_HDR
  }).then(function(r) {
    if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
  });
}

function loadItems() {
  document.getElementById('items-container').innerHTML = '<div class="empty">Loading&hellip;</div>';
  sbFetchAll()
    .then(function(rows) {
      records = rows;
      renderStats();
      renderItems();
    })
    .catch(function(e) {
      console.error(e);
      document.getElementById('items-container').innerHTML =
        '<div class="empty" style="color:#c62828">&#9888; Error loading supplies: ' + (e.message || e) + '</div>';
    });
}

/* ── Status helpers ───────────────────────────── */
function getStatus(r) {
  var cur = r.current_quantity != null ? +r.current_quantity : null;
  var min = r.reorder_level    != null ? +r.reorder_level    : null;
  if (cur === null) return 'ok';
  if (cur === 0)   return 'out';
  if (min > 0 && cur <= min)         return 'order';
  if (min > 0 && cur <= min * 1.5)   return 'low';
  return 'ok';
}
function statusChip(s) {
  var labels = { ok:'OK', low:'Low Stock', order:'Order Now', out:'Out of Stock' };
  return '<span class="status-chip chip-' + s + '">' + (labels[s]||s) + '</span>';
}
function storeBadge(s) {
  if (s === 'port-washington') return '<span class="badge b-pw">PW</span>';
  if (s === 'hicksville')      return '<span class="badge b-hv">HV</span>';
  return '';
}
function fmtDate(d) {
  if (!d) return '';
  var p = d.slice(0,10).split('-');
  var ms = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return ms[+p[1]-1] + ' ' + +p[2] + ', ' + p[0];
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* ── Stats ────────────────────────────────────── */
function renderStats() {
  var sf    = document.getElementById('filter-store').value;
  var src   = records.filter(function(r){ return !sf || r.store === sf; });
  var total = src.length;
  var ok    = src.filter(function(r){ return getStatus(r) === 'ok'; }).length;
  var low   = src.filter(function(r){ return getStatus(r) === 'low'; }).length;
  var order = src.filter(function(r){ var s = getStatus(r); return s === 'order' || s === 'out'; }).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-ok').textContent    = ok;
  document.getElementById('stat-low').textContent   = low;
  document.getElementById('stat-order').textContent = order;
}

/* ── Items render ─────────────────────────────── */
function getFiltered() {
  var sf  = document.getElementById('filter-store').value;
  var cf  = document.getElementById('filter-cat').value;
  var stf = document.getElementById('filter-status').value;
  return records.filter(function(r) {
    if (sf  && r.store !== sf)                     return false;
    if (cf  && (r.category||'').indexOf(cf) === -1) return false;
    if (stf && getStatus(r) !== stf)                return false;
    return true;
  });
}

function renderItems() {
  renderStats();
  var filtered = getFiltered();
  var el = document.getElementById('items-container');

  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty">No items found. Try adjusting the filters or <button class="btn-add" onclick="toggleAddForm(true)" style="padding:5px 12px;font-size:0.82rem">+ Add Item</button></div>';
    return;
  }

  filtered.sort(function(a, b) {
    var sOrder = { out:0, order:1, low:2, ok:3 };
    var sa = sOrder[getStatus(a)] || 3;
    var sb = sOrder[getStatus(b)] || 3;
    if (sa !== sb) return sa - sb;
    return (a.item_name||'').localeCompare(b.item_name||'');
  });

  var html = '<div class="items-grid">';
  filtered.forEach(function(rec) {
    var id  = rec.id;
    var st  = getStatus(rec);
    var cur = rec.current_quantity != null ? +rec.current_quantity : '–';
    var min = rec.reorder_level    != null ? +rec.reorder_level    : null;
    var unit    = rec.unit || '';
    var cat     = rec.category || '';
    var store   = rec.store;
    var updated = rec.last_updated ? fmtDate(rec.last_updated) : null;

    var fillPct  = 0;
    var fillCls  = 'fill-ok';
    if (cur !== '–' && min > 0) {
      fillPct = Math.min(100, Math.round((cur / (min * 2)) * 100));
      fillCls = st === 'ok' ? 'fill-ok' : (st === 'low' ? 'fill-low' : 'fill-order');
    } else if (cur !== '–') {
      fillPct = cur > 0 ? 80 : 0;
    }

    html += '<div class="item-card status-' + st + '" id="card-' + id + '">' +
      '<div class="item-top">' +
        '<div class="item-name">' + esc(rec.item_name || 'Untitled') + '</div>' +
        statusChip(st) +
      '</div>' +
      '<div class="item-badges">' +
        (cat ? '<span class="badge b-cat">' + esc(cat) + '</span>' : '') +
        storeBadge(store) +
      '</div>' +
      '<div class="qty-row">' +
        '<div class="qty-big">' + cur + '</div>' +
        (unit ? '<div class="qty-unit">' + esc(unit) + '</div>' : '') +
        (min > 0 ? '<div class="qty-min">min: ' + min + '</div>' : '') +
      '</div>' +
      (min > 0 ? '<div class="qty-bar"><div class="qty-fill ' + fillCls + '" style="width:' + fillPct + '%"></div></div>' : '') +
      '<div class="item-meta">' +
        (updated ? '&#128197; Updated: ' + updated : '') +
      '</div>' +
      '<div class="item-actions" id="actions-' + id + '">' +
        '<button class="btn-sm" onclick="startEdit(\'' + id + '\',' + (cur !== '–' ? cur : 0) + ')">&#9998; Update Qty</button>' +
        '<button class="btn-sm btn-order" onclick="doDelete(\'' + id + '\')" style="margin-left:auto">&#10005;</button>' +
      '</div>' +
      '<div id="edit-' + id + '" class="hidden">' +
        '<div class="edit-qty-row">' +
          '<div style="display:flex;flex-direction:column;gap:2px">' +
            '<label style="font-size:0.68rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.04em">Current Qty</label>' +
            '<input type="number" class="edit-qty-input" id="qty-input-' + id + '" value="' + (cur !== '–' ? cur : 0) + '" min="0" step="0.25">' +
          '</div>' +
          (unit ? '<span style="font-size:0.82rem;color:#888;align-self:flex-end;padding-bottom:4px">' + esc(unit) + '</span>' : '') +
          '<div style="display:flex;flex-direction:column;gap:2px">' +
            '<label style="font-size:0.68rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.04em">Min Level</label>' +
            '<input type="number" class="edit-qty-input" id="min-input-' + id + '" value="' + (min !== null ? min : 0) + '" min="0" step="0.25" style="border-color:#888">' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:4px;align-self:flex-end">' +
            '<button class="btn-save" onclick="saveQty(\'' + id + '\')">Save</button>' +
            '<button class="btn-cancel" onclick="cancelEdit(\'' + id + '\')">Cancel</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

/* ── Edit qty ─────────────────────────────────── */
function startEdit(id, cur) {
  document.getElementById('actions-' + id).classList.add('hidden');
  document.getElementById('edit-' + id).classList.remove('hidden');
  var inp = document.getElementById('qty-input-' + id);
  inp.value = cur;
  inp.focus();
  inp.select();
}
function cancelEdit(id) {
  document.getElementById('actions-' + id).classList.remove('hidden');
  document.getElementById('edit-' + id).classList.add('hidden');
}
function saveQty(id) {
  var val = +document.getElementById('qty-input-' + id).value;
  var minVal = +document.getElementById('min-input-' + id).value;
  if (isNaN(val) || val < 0) { showToast('Invalid quantity', 'error'); return; }
  if (isNaN(minVal) || minVal < 0) { showToast('Invalid min level', 'error'); return; }
  var patch = { current_quantity: val, reorder_level: minVal, last_updated: new Date().toISOString() };
  sbPatch(id, patch)
    .then(function(updated) {
      var idx = records.findIndex(function(r){ return r.id === id; });
      if (idx >= 0 && updated) records[idx] = updated;
      renderStats();
      renderItems();
      showToast('Updated');
    })
    .catch(function(e) {
      console.error(e);
      showToast('Update failed — ' + e.message, 'error');
    });
}

/* ── Delete ───────────────────────────────────── */
function doDelete(id) {
  var rec = records.find(function(r){ return r.id === id; });
  var name = rec ? (rec.item_name || 'this item') : 'this item';
  if (!confirm('Delete "' + name + '" from supplies? This cannot be undone.')) return;
  sbDelete(id)
    .then(function() {
      records = records.filter(function(r){ return r.id !== id; });
      renderStats();
      renderItems();
      showToast('Item deleted');
    })
    .catch(function(e) {
      console.error(e);
      showToast('Delete failed — ' + e.message, 'error');
    });
}

/* ── Add item ─────────────────────────────────── */
function toggleAddForm(show) {
  document.getElementById('add-panel').classList.toggle('hidden', !show);
  if (show) document.getElementById('a-name').focus();
}
function handleAdd() {
  var name  = document.getElementById('a-name').value.trim();
  var store = document.getElementById('a-store').value;
  if (!name)  { showToast('Item name is required', 'error'); return; }
  if (!store) { showToast('Store is required', 'error'); return; }
  var row = {
    store:            store,
    item_name:        name,
    category:         document.getElementById('a-cat').value.trim() || null,
    current_quantity: +document.getElementById('a-qty').value || 0,
    unit:             document.getElementById('a-unit').value.trim() || null,
    reorder_level:    +document.getElementById('a-minqty').value || null,
    last_updated:     new Date().toISOString()
  };

  var btn = document.getElementById('add-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  sbInsert(row)
    .then(function(rec) {
      if (rec) records.unshift(rec);
      renderStats();
      renderItems();
      toggleAddForm(false);
      ['a-name','a-qty','a-unit','a-minqty'].forEach(function(id){
        document.getElementById(id).value = (id === 'a-qty' || id === 'a-minqty') ? '0' : '';
      });
      document.getElementById('a-store').value = '';
      document.getElementById('a-cat').value = '';
      showToast('Item added');
    })
    .catch(function(e) {
      console.error(e);
      showToast('Failed to add — ' + e.message, 'error');
    })
    .finally(function() {
      btn.disabled = false; btn.textContent = '+ Add Item';
    });
}

/* ── Init ─────────────────────────────────────── */
loadItems();

</script>
