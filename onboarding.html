<!DOCTYPE html>
<html lang="en">
<head>
<script>if(sessionStorage.getItem('wg_portal_auth')!=='1')window.location.href='index.html';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woof Gang — New Hire Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#FDF0F5;min-height:100vh;color:#1a1a2e}
.header{background:linear-gradient(135deg,#C4276E 0%,#6B3520 100%);padding:28px 32px 22px;text-align:center;color:white;position:relative}
.header h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.02em}
.header p{font-size:0.85rem;opacity:0.85;margin-top:2px}
.back-link{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.85);text-decoration:none;font-size:0.82rem;font-weight:700;background:rgba(255,255,255,0.15);padding:7px 14px;border-radius:8px}
.back-link:hover{background:rgba(255,255,255,0.28)}

.main{max-width:820px;width:100%;margin:0 auto;padding:28px 24px 60px}

/* Progress */
.progress-wrap{background:white;border-radius:14px;padding:20px 24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);margin-bottom:24px}
.progress-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.progress-label{font-size:0.92rem;font-weight:700;color:#1a1a2e}
.progress-count{font-size:0.85rem;font-weight:700;color:#C4276E}
.progress-bar{height:10px;background:#f0e0e8;border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#C4276E,#e91e8c);border-radius:6px;transition:width 0.4s ease}
.done-banner{display:none;background:linear-gradient(135deg,#2E7D32,#43A047);color:white;border-radius:12px;padding:16px 20px;margin-top:14px;font-weight:700;font-size:0.92rem;text-align:center}
.done-banner.show{display:block}

/* Topic cards */
.topic{background:white;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.06);margin-bottom:14px;overflow:hidden;border-left:5px solid #C4276E;transition:border-color 0.3s}
.topic.completed{border-left-color:#2E7D32}
.topic-header{display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;user-select:none;transition:background 0.15s}
.topic-header:hover{background:#fdf8fa}
.topic-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:800;color:white;flex-shrink:0;transition:background 0.3s}
.topic-title{font-size:1rem;font-weight:700;color:#1a1a2e;flex:1}
.topic-check{width:24px;height:24px;border:2.5px solid #ccc;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.2s}
.topic-check:hover{border-color:#C4276E}
.topic-check.checked{background:#2E7D32;border-color:#2E7D32}
.topic-check.checked::after{content:'\2713';color:white;font-size:0.85rem;font-weight:800}
.topic-arrow{font-size:0.75rem;color:#bbb;transition:transform 0.2s;flex-shrink:0}
.topic.open .topic-arrow{transform:rotate(90deg)}

.topic-body{display:none;padding:0 20px 20px;border-top:1px solid #f0f0f0}
.topic.open .topic-body{display:block}

.outcome{background:#f0faf0;border-radius:10px;padding:14px 16px;margin:14px 0;font-size:0.88rem;line-height:1.6}
.outcome strong{color:#2E7D32;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:4px}

.notes{font-size:0.88rem;color:#555;line-height:1.7;margin:10px 0}
.notes strong{color:#1a1a2e;display:block;margin-bottom:4px;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em}

.hub-docs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.hub-pill{font-size:0.72rem;font-weight:600;padding:4px 10px;border-radius:12px;background:#FDF0F5;color:#C4276E;text-transform:uppercase;letter-spacing:0.03em}

/* Reference sections */
.ref-section{background:#fafafa;border-radius:10px;padding:16px;margin-top:14px;border:1px solid #eee}
.ref-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.82rem;font-weight:700;color:#6B3520;user-select:none}
.ref-toggle:hover{color:#C4276E}
.ref-arrow{font-size:0.65rem;transition:transform 0.2s}
.ref-section.open .ref-arrow{transform:rotate(90deg)}
.ref-content{display:none;margin-top:12px;font-size:0.82rem;line-height:1.7;color:#555}
.ref-section.open .ref-content{display:block}
.ref-content h4{font-size:0.78rem;font-weight:700;color:#1a1a2e;margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.04em}
.ref-content h4:first-child{margin-top:0}
.ref-content ul{margin:4px 0 10px 18px}
.ref-content li{margin-bottom:4px}
.ref-content .script{background:white;border-radius:8px;padding:12px;margin:8px 0;border-left:3px solid #C4276E;font-size:0.82rem;line-height:1.6}
.ref-content .script .role{font-weight:700;color:#C4276E}
.ref-content .script .cust{font-weight:700;color:#6B3520}
.ref-content .pro-tip{background:#FDF0F5;border-left:3px solid #E8006A;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:0.82rem;line-height:1.6}
.ref-content a{color:#C4276E;font-weight:700;text-decoration:underline}
.ref-content a:hover{color:#E8006A}

/* Bottom actions */
.actions{text-align:center;padding:16px 0}
.btn-reset{padding:8px 20px;border:2px solid #ddd;background:white;border-radius:8px;font-family:inherit;font-size:0.82rem;font-weight:700;cursor:pointer;color:#888;transition:all 0.15s}
.btn-reset:hover{border-color:#C62828;color:#C62828}

/* Edit mode (owner/manager only) */
.edit-toggle-wrap{text-align:center;margin-bottom:16px}
.btn-edit-toggle{background:#1a1a2e;color:white;border:none;padding:9px 20px;border-radius:20px;font-family:inherit;font-size:0.82rem;font-weight:700;cursor:pointer}
.btn-edit-toggle:hover{opacity:0.85}
.btn-edit-toggle.active{background:#C4276E}
.topic-edit-btns{display:flex;gap:4px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;font-size:0.9rem;color:#aaa;padding:4px}
.icon-btn:hover{color:#C4276E}
.btn-add{padding:8px 16px;background:#C4276E;color:white;border:none;border-radius:8px;font-family:inherit;font-size:0.82rem;font-weight:700;cursor:pointer;margin-top:10px}
.btn-add:hover{background:#a31f5b}
.btn-add.ghost{background:white;color:#C4276E;border:2px dashed #e8b8cc}
.ref-edit-btns{display:flex;gap:4px;margin-left:auto}
.ref-toggle-row{display:flex;align-items:center}

/* Edit modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9998;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:white;border-radius:14px;padding:26px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto}
.modal-box h3{font-size:1.1rem;font-weight:800;margin-bottom:16px}
.modal-fg{margin-bottom:14px}
.modal-fg label{display:block;font-size:0.72rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px}
.modal-fg input,.modal-fg textarea{width:100%;padding:9px 11px;border:2px solid #ddd;border-radius:8px;font-family:inherit;font-size:0.88rem;color:#1a1a2e}
.modal-fg input:focus,.modal-fg textarea:focus{outline:none;border-color:#C4276E}
.modal-fg textarea{min-height:70px;resize:vertical;font-family:ui-monospace,monospace;font-size:0.78rem}
.modal-fg .hint{font-size:0.72rem;color:#999;margin-top:4px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal-btns button{padding:9px 20px;border-radius:8px;font-family:inherit;font-size:0.86rem;font-weight:700;cursor:pointer;border:none}
.modal-btns .btn-cancel{background:#eee;color:#555}
.modal-btns .btn-save{background:#C4276E;color:white}
.modal-btns .btn-save:hover{background:#a31f5b}

/* Colors for topic numbers */
.c1{background:#C4276E}.c2{background:#6B3520}.c3{background:#1B6B6B}.c4{background:#E65100}
.c5{background:#1565C0}.c6{background:#7B1FA2}.c7{background:#2E7D32}.c8{background:#C62828}
.c9{background:#00838F}.c10{background:#37474F}.c11{background:#F9A825}

@media(max-width:700px){
  .header{padding:20px 16px 16px}
  .header h1{font-size:1.3rem}
  .back-link{position:static;display:inline-block;margin-bottom:10px;transform:none}
  .main{padding:16px 12px 40px}
  .topic-header{padding:14px 14px;gap:10px}
  .topic-body{padding:0 14px 16px}
  .topic-num{width:30px;height:30px;font-size:0.75rem}
}
@media print{
  .back-link,.actions,.progress-wrap,.topic-check,.topic-arrow{display:none!important}
  .header{background:#C4276E!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .topic-body{display:block!important}
  .topic{break-inside:avoid;margin-bottom:10px;box-shadow:none;border:1px solid #ddd}
  .ref-content{display:block!important}
  body{background:white}
}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-link" id="portal-back">&larr; Portal</a>
  <script>!function(){var l=sessionStorage.getItem('wg_portal_level'),a=document.getElementById('portal-back');if(l==='manager'){a.href='manager.html';a.textContent='\u2190 Manager Portal';}else if(l==='store'){a.href='store.html';a.textContent='\u2190 Store Portal';}else{a.textContent='\u2190 Owner Portal';}}();</script>
  <h1>New Hire Onboarding</h1>

<div class="progress-wrap">

    <span class="progress-label">Onboarding Progress</span>

</div>

<div class="modal-overlay" id="topic-modal-overlay">

    <div class="modal-fg"><label>Section Title</label><input type="text" id="rm-title"></div>
    <div class="modal-fg">

      <textarea id="rm-content" style="min-height:220px"></textarea>

    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRefModal()">Cancel</button>
      <button class="btn-save" onclick="saveRefModal()">Save</button>
    </div>
  </div>
</div>

<script>
/* ── Config ───────────────────────────────────── */
var SB_URL = 'https://bqzinttbjeeaybywhhet.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxemludHRiamVlYXlieXdoaGV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3MDU3NDUsImV4cCI6MjA4OTI4MTc0NX0.B2MqUy_WEWOo8NVpGxHibuh-8xLklsy3Ux4DnXp9zmQ';
var SB_HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
function sbFetch(path, opts) { return fetch(SB_URL + path, Object.assign({ headers: SB_HDR }, opts)); }

var COLOR_PALETTE = ['c1','c2','c3','c4','c5','c6','c7','c8','c9','c10','c11'];
function colorFor(idx) { return COLOR_PALETTE[idx % COLOR_PALETTE.length]; }

var portalLevel = sessionStorage.getItem('wg_portal_level') || '';
var canEdit = (portalLevel === 'owner' || portalLevel === 'manager');
var editMode = false;

var topics = [];       // [{id, title, outcome, notes, hub:[...], refs:[{id,title,content,sort_order}, ...]}]
var editingTopicId = null;  // null = adding new
var editingRefId = null;
var editingRefTopicId = null;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── HTML sanitizer for reference content ────────
   Only admins (owner/manager) can write this content, but we sanitize on
   render anyway as defense in depth — strips anything outside a small
   known-safe tag/attribute allowlist via the browser's own HTML parser
   (DOMParser never executes scripts), so a typo or copy-paste mistake
   can't inject something unexpected into every trainee's screen. */
var ALLOWED_TAGS = {h4:[], p:[], ul:[], li:[], strong:[], em:[], br:[], div:['class'], span:['class'], a:['href']};
/* Only relative links or http(s) URLs are kept — blocks javascript:/data: etc. */
function isSafeHref(href){
  return /^(https?:\/\/|\.?\/|[a-zA-Z0-9_-]+(\.html)?(\?|#|$))/.test(href || '');
}
function sanitizeHtml(html){
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  var root = doc.body.firstChild;
  if (!root) return '';
  (function clean(node){
    var toRemove = [];
    Array.prototype.forEach.call(node.childNodes, function(child){
      if (child.nodeType === 1) {
        var tag = child.tagName.toLowerCase();
        if (!ALLOWED_TAGS.hasOwnProperty(tag)) { toRemove.push(child); return; }
        var allowedAttrs = ALLOWED_TAGS[tag];
        Array.prototype.slice.call(child.attributes).forEach(function(attr){
          if (allowedAttrs.indexOf(attr.name) === -1) child.removeAttribute(attr.name);
        });
        if (tag === 'a') {
          if (!isSafeHref(child.getAttribute('href'))) child.removeAttribute('href');
          child.setAttribute('target', '_blank');
          child.setAttribute('rel', 'noopener noreferrer');
        }
        clean(child);
      } else if (child.nodeType !== 3) {
        toRemove.push(child);
      }
    });
    toRemove.forEach(function(n){ node.removeChild(n); });
  })(root);
  return root.innerHTML;
}

/* ── Load ─────────────────────────────────────── */
function loadTopics(){
  Promise.all([
    sbFetch('/rest/v1/onboarding_topics?is_active=eq.true&order=sort_order,created_at').then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('topics: ' + r.status)); }),
    sbFetch('/rest/v1/onboarding_refs?order=sort_order,created_at').then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('refs: ' + r.status)); })
  ]).then(function(results){
    var rawTopics = results[0], rawRefs = results[1];
    var refsByTopic = {};
    rawRefs.forEach(function(r){
      if (!refsByTopic[r.topic_id]) refsByTopic[r.topic_id] = [];
      refsByTopic[r.topic_id].push(r);
    });
    topics = rawTopics.map(function(t){
      var hub = [];
      try { hub = typeof t.hub === 'string' ? JSON.parse(t.hub) : (t.hub || []); } catch(e) { hub = []; }
      return { id: t.id, title: t.title, outcome: t.outcome || '', notes: t.notes || '', hub: hub, refs: refsByTopic[t.id] || [] };
    });
    if (canEdit) document.getElementById('edit-toggle-wrap').style.display = '';
    renderTopics();
  }).catch(function(err){
    console.error(err);
    document.getElementById('topics').innerHTML = '<div style="text-align:center;color:#c62828;padding:30px;background:white;border-radius:14px">Could not load onboarding content — refresh to retry.</div>';
  });
}

/* ── Completion state (per-browser, unchanged from before) ─────────── */
var KEY='wg_onboarding';
function getChecked(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return[];}}
function setChecked(arr){localStorage.setItem(KEY,JSON.stringify(arr));}

function updateProgress(){
  var checked=getChecked(), total=topics.length, done=checked.filter(function(id){ return topics.some(function(t){ return t.id===id; }); }).length;
  document.getElementById('prog-count').textContent=done+' of '+total;
  document.getElementById('prog-fill').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('done-banner').className='done-banner'+(total>0&&done===total?' show':'');
}

function toggleCheck(id){
  var checked=getChecked(), idx=checked.indexOf(id);
  if(idx>=0) checked.splice(idx,1); else checked.push(id);
  setChecked(checked);
  renderTopics();
}

function toggleTopic(id){
  var el=document.querySelector('[data-topic="'+id+'"]');
  if(el) el.classList.toggle('open');
}

function toggleRef(btn){
  btn.closest('.ref-section').classList.toggle('open');
}

function resetProgress(){
  if(!confirm('Reset all onboarding progress?')) return;
  localStorage.removeItem(KEY);
  renderTopics();
}

/* ── Edit mode ────────────────────────────────── */
function toggleEditMode(){
  editMode = !editMode;
  var btn = document.getElementById('edit-toggle-btn');
  btn.classList.toggle('active', editMode);
  btn.textContent = editMode ? '✓ Done Editing' : '✎ Edit Topics';
  document.getElementById('add-topic-wrap').style.display = editMode ? '' : 'none';
  renderTopics();
}

function moveTopic(id, dir){
  var idx = topics.findIndex(function(t){ return t.id === id; });
  var swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= topics.length) return;
  var a = topics[idx], b = topics[swapIdx];
  topics[idx] = b; topics[swapIdx] = a;
  renderTopics();
  Promise.all([
    sbFetch('/rest/v1/onboarding_topics?id=eq.' + a.id, { method:'PATCH', headers:SB_HDR, body: JSON.stringify({ sort_order: swapIdx+1 }) }),
    sbFetch('/rest/v1/onboarding_topics?id=eq.' + b.id, { method:'PATCH', headers:SB_HDR, body: JSON.stringify({ sort_order: idx+1 }) })
  ]).catch(function(){ alert('Could not save the new order — refresh to retry.'); });
}

function deleteTopic(id){
  if(!confirm('Remove this topic and all its reference sections? This cannot be undone.')) return;
  sbFetch('/rest/v1/onboarding_topics?id=eq.' + id, { method:'DELETE', headers:SB_HDR })
    .then(function(r){
      if(!r.ok) throw new Error('delete failed');
      topics = topics.filter(function(t){ return t.id !== id; });
      renderTopics();
    })
    .catch(function(){ alert('Could not remove topic — try again.'); });
}

/* ── Topic modal ──────────────────────────────── */
function openTopicModal(id){
  editingTopicId = id;
  var t = id ? topics.find(function(x){ return x.id === id; }) : null;
  document.getElementById('topic-modal-title').textContent = t ? 'Edit Topic' : 'Add Topic';
  document.getElementById('tm-title').value = t ? t.title : '';
  document.getElementById('tm-outcome').value = t ? t.outcome : '';
  document.getElementById('tm-notes').value = t ? t.notes : '';
  document.getElementById('tm-hub').value = t ? t.hub.join(', ') : '';
  document.getElementById('topic-modal-overlay').classList.add('open');
}
function closeTopicModal(){ document.getElementById('topic-modal-overlay').classList.remove('open'); }

function saveTopicModal(){
  var title = document.getElementById('tm-title').value.trim();
  if(!title){ alert('Title is required'); return; }
  var body = {
    title: title,
    outcome: document.getElementById('tm-outcome').value.trim(),
    notes: document.getElementById('tm-notes').value.trim(),
    hub: JSON.stringify(document.getElementById('tm-hub').value.split(',').map(function(s){return s.trim();}).filter(Boolean))
  };
  if(editingTopicId){
    sbFetch('/rest/v1/onboarding_topics?id=eq.' + editingTopicId, {
      method:'PATCH', headers: Object.assign({}, SB_HDR, {'Prefer':'return=representation'}),
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(res){
      var saved = Array.isArray(res)?res[0]:res;
      var t = topics.find(function(x){ return x.id === editingTopicId; });
      if(t && saved){ t.title=saved.title; t.outcome=saved.outcome||''; t.notes=saved.notes||''; try{t.hub=JSON.parse(saved.hub);}catch(e){} }
      closeTopicModal(); renderTopics();
    }).catch(function(){ alert('Could not save changes.'); });
  } else {
    body.sort_order = topics.length + 1;
    sbFetch('/rest/v1/onboarding_topics', {
      method:'POST', headers: Object.assign({}, SB_HDR, {'Prefer':'return=representation'}),
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(res){
      var saved = Array.isArray(res)?res[0]:res;
      if(saved){
        var hub=[]; try{hub=JSON.parse(saved.hub);}catch(e){}
        topics.push({ id:saved.id, title:saved.title, outcome:saved.outcome||'', notes:saved.notes||'', hub:hub, refs:[] });
      }
      closeTopicModal(); renderTopics();
    }).catch(function(){ alert('Could not add topic.'); });
  }
}

/* ── Reference modal ──────────────────────────── */
function openRefModal(topicId, refId){
  editingRefTopicId = topicId;
  editingRefId = refId;
  var r = null;
  if(refId){
    var t = topics.find(function(x){ return x.id === topicId; });
    r = t.refs.find(function(x){ return x.id === refId; });
  }
  document.getElementById('ref-modal-title').textContent = r ? 'Edit Reference' : 'Add Reference';
  document.getElementById('rm-title').value = r ? r.title : '';
  document.getElementById('rm-content').value = r ? r.content : '';
  document.getElementById('ref-modal-overlay').classList.add('open');
}
function closeRefModal(){ document.getElementById('ref-modal-overlay').classList.remove('open'); }

function saveRefModal(){
  var title = document.getElementById('rm-title').value.trim();
  var content = document.getElementById('rm-content').value.trim();
  if(!title || !content){ alert('Both a title and content are required'); return; }
  var t = topics.find(function(x){ return x.id === editingRefTopicId; });
  if(editingRefId){
    sbFetch('/rest/v1/onboarding_refs?id=eq.' + editingRefId, {
      method:'PATCH', headers: Object.assign({}, SB_HDR, {'Prefer':'return=representation'}),
      body: JSON.stringify({ title: title, content: content })
    }).then(function(r){ return r.json(); }).then(function(res){
      var saved = Array.isArray(res)?res[0]:res;
      var ref = t.refs.find(function(x){ return x.id === editingRefId; });
      if(ref && saved){ ref.title=saved.title; ref.content=saved.content; }
      closeRefModal(); renderTopics();
    }).catch(function(){ alert('Could not save changes.'); });
  } else {
    sbFetch('/rest/v1/onboarding_refs', {
      method:'POST', headers: Object.assign({}, SB_HDR, {'Prefer':'return=representation'}),
      body: JSON.stringify({ topic_id: editingRefTopicId, title: title, content: content, sort_order: t.refs.length + 1 })
    }).then(function(r){ return r.json(); }).then(function(res){
      var saved = Array.isArray(res)?res[0]:res;
      if(saved) t.refs.push(saved);
      closeRefModal(); renderTopics();
    }).catch(function(){ alert('Could not add reference.'); });
  }
}

function deleteRef(topicId, refId){
  if(!confirm('Remove this reference section?')) return;
  sbFetch('/rest/v1/onboarding_refs?id=eq.' + refId, { method:'DELETE', headers:SB_HDR })
    .then(function(r){
      if(!r.ok) throw new Error('delete failed');
      var t = topics.find(function(x){ return x.id === topicId; });
      t.refs = t.refs.filter(function(x){ return x.id !== refId; });
      renderTopics();
    })
    .catch(function(){ alert('Could not remove reference — try again.'); });
}

/* ── Render ───────────────────────────────────── */
function renderTopics(){
  var checked=getChecked();
  var openTopics=[];
  document.querySelectorAll('.topic.open').forEach(function(el){openTopics.push(el.dataset.topic);});

  var html=topics.map(function(t,idx){
    var isDone=checked.indexOf(t.id)>=0;
    var isOpen=openTopics.indexOf(t.id)>=0;

    var h='<div class="topic'+(isDone?' completed':'')+(isOpen?' open':'')+'" data-topic="'+t.id+'">';
    h+='<div class="topic-header" onclick="toggleTopic(\''+t.id+'\')">';
    h+='<div class="topic-num '+colorFor(idx)+'">'+(idx+1)+'</div>';
    h+='<div class="topic-title">'+esc(t.title)+'</div>';
    if(editMode){
      h+='<div class="topic-edit-btns" onclick="event.stopPropagation()">';
      h+='<button class="icon-btn" onclick="moveTopic(\''+t.id+'\',-1)" title="Move up">&#8593;</button>';
      h+='<button class="icon-btn" onclick="moveTopic(\''+t.id+'\',1)" title="Move down">&#8595;</button>';
      h+='<button class="icon-btn" onclick="openTopicModal(\''+t.id+'\')" title="Edit">&#9998;</button>';
      h+='<button class="icon-btn" onclick="deleteTopic(\''+t.id+'\')" title="Delete">&#128465;</button>';
      h+='</div>';
    } else {
      h+='<div class="topic-check'+(isDone?' checked':'')+'" onclick="event.stopPropagation();toggleCheck(\''+t.id+'\')"></div>';
    }
    h+='<div class="topic-arrow">&#9654;</div>';
    h+='</div>';

    h+='<div class="topic-body">';
    if (t.outcome) h+='<div class="outcome"><strong>Learning Outcome</strong>'+esc(t.outcome)+'</div>';
    if (t.notes) h+='<div class="notes"><strong>Key Points</strong>'+esc(t.notes)+'</div>';

    if(t.hub.length){
      h+='<div style="margin-top:10px"><strong style="font-size:0.75rem;color:#888;text-transform:uppercase;letter-spacing:0.05em">Learning Hub</strong></div>';
      h+='<div class="hub-docs">'+t.hub.map(function(d){return '<span class="hub-pill">'+esc(d)+'</span>';}).join('')+'</div>';
    }

    if(t.refs&&t.refs.length){
      t.refs.forEach(function(r){
        h+='<div class="ref-section">';
        h+='<div class="ref-toggle-row"><div class="ref-toggle" onclick="toggleRef(this)"><span class="ref-arrow">&#9654;</span> '+esc(r.title)+'</div>';
        if(editMode){
          h+='<div class="ref-edit-btns">';
          h+='<button class="icon-btn" onclick="openRefModal(\''+t.id+'\',\''+r.id+'\')" title="Edit">&#9998;</button>';
          h+='<button class="icon-btn" onclick="deleteRef(\''+t.id+'\',\''+r.id+'\')" title="Delete">&#128465;</button>';
          h+='</div>';
        }
        h+='</div>';
        h+='<div class="ref-content">'+sanitizeHtml(r.content)+'</div>';
        h+='</div>';
      });
    }

    if(editMode){
      h+='<button class="btn-add ghost" onclick="openRefModal(\''+t.id+'\',null)">+ Add Reference Section</button>';
    }

    h+='</div></div>';
    return h;
  }).join('');

  document.getElementById('topics').innerHTML=html;
  updateProgress();
}

loadTopics();
</script>
</body>
</html>
