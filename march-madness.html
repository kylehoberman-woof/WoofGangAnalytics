<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>March Madness 2026 - Bracket Challenge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e27;
    --card: #141832;
    --card-border: #1e2a4a;
    --orange: #ff6b35;
    --gold: #ffd700;
    --green: #4ade80;
    --red: #ef4444;
    --text: #ffffff;
    --text2: #94a3b8;
    --blue: #3b82f6;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }

  .header { text-align: center; margin-bottom: 24px; }
  .header h1 {
    font-size: 2.2rem; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(135deg, var(--orange), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .header .subtitle { color: var(--text2); font-size: 0.95rem; margin-top: 4px; }

  .rules { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; font-size: 0.82rem; }
  .rule-chip { background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; padding: 6px 14px; color: var(--text2); }
  .rule-chip b { color: var(--text); }

  /* Sync bar */
  .sync-bar { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .sync-btn {
    background: linear-gradient(135deg, #1e40af, #3b82f6); border: none; border-radius: 10px;
    color: #fff; padding: 10px 22px; cursor: pointer; font-weight: 700; font-size: 0.9rem;
    display: flex; align-items: center; gap: 8px; transition: all 0.2s;
  }
  .sync-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .sync-btn:active { transform: translateY(0); }
  .sync-btn.loading { opacity: 0.7; pointer-events: none; }
  .sync-btn.loading .sync-icon { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-icon { display: inline-block; font-size: 1.1rem; }
  .sync-status { font-size: 0.78rem; color: var(--text2); }
  .sync-status .match-info { color: var(--green); }
  .sync-status .error-info { color: var(--red); }
  .reset-btn {
    background: none; border: 1px solid var(--card-border); border-radius: 8px;
    color: var(--text2); padding: 8px 14px; cursor: pointer; font-size: 0.78rem; transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  /* Leaderboard */
  .leaderboard {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 20px 24px; margin-bottom: 28px; max-width: 700px; margin-left: auto; margin-right: auto;
  }
  .leaderboard h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text2); margin-bottom: 16px; }
  .lb-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; transition: all 0.4s ease; }
  .lb-rank { font-size: 1.1rem; font-weight: 700; width: 28px; text-align: center; color: var(--text2); }
  .lb-rank.first { color: var(--gold); }
  .lb-rank.second { color: #c0c0c0; }
  .lb-rank.third { color: #cd7f32; }
  .lb-name { font-weight: 700; width: 70px; font-size: 0.95rem; }
  .lb-bar-wrap { flex: 1; height: 28px; background: rgba(255,255,255,0.05); border-radius: 6px; overflow: hidden; position: relative; }
  .lb-bar { height: 100%; border-radius: 6px; transition: width 0.6s ease; min-width: 2px; }
  .lb-score { font-weight: 700; font-size: 1.1rem; width: 55px; text-align: right; }

  /* Round Scoreboard */
  .round-scoreboard {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 20px 24px; margin-bottom: 28px; max-width: 800px; margin-left: auto; margin-right: auto;
    overflow-x: auto;
  }
  .round-scoreboard h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text2); margin-bottom: 16px; }
  .round-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .round-table th { color: var(--text2); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; padding: 6px 10px; text-align: center; border-bottom: 1px solid var(--card-border); }
  .round-table th:first-child { text-align: left; }
  .round-table td { padding: 8px 10px; text-align: center; }
  .round-table td:first-child { text-align: left; font-weight: 700; }
  .round-table tr:not(:last-child) td { border-bottom: 1px solid rgba(255,255,255,0.03); }
  .round-table .total-col { color: var(--orange); font-weight: 800; }
  .round-table .has-pts { color: var(--green); font-weight: 700; }
  .round-table .no-pts { color: rgba(255,255,255,0.15); }
  .round-table .current-round { background: rgba(255,107,53,0.08); }

  /* Live Games */
  .live-section {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 20px 24px; margin-bottom: 28px; max-width: 900px; margin-left: auto; margin-right: auto;
  }
  .live-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .live-header h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text2); }
  .live-pulse {
    width: 10px; height: 10px; border-radius: 50%; background: var(--red);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(239,68,68,0); } }
  .live-pulse.done { background: var(--green); animation: none; }
  .live-pulse.scheduled { background: var(--text2); animation: none; }
  .live-games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .live-game {
    background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 12px; transition: border-color 0.2s;
  }
  .live-game.in-progress { border-color: rgba(239,68,68,0.4); }
  .live-game.final { border-color: rgba(74,222,128,0.2); }
  .live-game-round { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom: 6px; }
  .live-game-status { font-size: 0.7rem; margin-top: 8px; text-align: center; }
  .live-game-status.live { color: var(--red); font-weight: 700; }
  .live-game-status.done { color: var(--green); }
  .live-game-status.sched { color: var(--text2); }
  .live-team-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .live-seed { font-size: 0.7rem; color: var(--text2); width: 18px; text-align: center; }
  .live-team-name { flex: 1; font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live-team-name.picked { color: var(--orange); font-weight: 700; }
  .live-team-name.winner { color: var(--green); font-weight: 700; }
  .live-score { font-size: 0.9rem; font-weight: 700; width: 30px; text-align: right; }
  .live-owner { font-size: 0.68rem; color: var(--text2); font-weight: 400; }
  .live-picked-by { font-size: 0.65rem; color: var(--text2); margin-top: 6px; text-align: center; font-style: italic; }
  .no-games { color: var(--text2); font-size: 0.85rem; text-align: center; padding: 16px 0; }

  /* Player cards */
  .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 28px; }
  .player-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; transition: border-color 0.2s; }
  .player-card:hover { border-color: rgba(255,107,53,0.3); }
  .player-header { padding: 16px 20px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); }
  .player-name { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; }
  .player-score { font-size: 1.4rem; font-weight: 800; color: var(--orange); }
  .player-score span { font-size: 0.75rem; font-weight: 400; color: var(--text2); }
  .player-meta { font-size: 0.75rem; color: var(--text2); padding: 0 20px; margin-top: 6px; }

  .player-rounds { display: flex; gap: 4px; padding: 8px 20px 4px; flex-wrap: wrap; }
  .player-round-chip {
    font-size: 0.65rem; padding: 3px 8px; border-radius: 10px;
    background: rgba(255,255,255,0.04); color: var(--text2); border: 1px solid transparent;
  }
  .player-round-chip.has-pts { background: rgba(74,222,128,0.1); color: var(--green); border-color: rgba(74,222,128,0.2); }
  .player-round-chip b { font-weight: 700; }

  .team-list { padding: 8px 0; }
  .team-row { display: flex; align-items: center; padding: 8px 20px; gap: 10px; transition: background 0.15s; }
  .team-row:hover { background: rgba(255,255,255,0.02); }
  .team-row.eliminated { opacity: 0.35; }
  .team-row.eliminated .team-name { text-decoration: line-through; }
  .team-row.champion .team-name { color: var(--gold); }

  .seed-badge { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; }
  .seed-1-4 { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
  .seed-5-9 { background: rgba(168,85,247,0.2); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
  .seed-10-12 { background: rgba(249,115,22,0.2); color: #fb923c; border: 1px solid rgba(249,115,22,0.3); }
  .seed-13-16 { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

  .team-name { flex: 1; font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .round-label { font-size: 0.7rem; color: var(--text2); width: 50px; text-align: center; flex-shrink: 0; }
  .round-label.advanced { color: var(--green); font-weight: 600; }
  .round-label.champion { color: var(--gold); font-weight: 700; }

  .team-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .btn {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.05); color: var(--text); font-size: 0.85rem; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; line-height: 1;
  }
  .btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
  .btn.btn-add:hover { border-color: var(--green); color: var(--green); }
  .btn.btn-sub:hover { border-color: var(--red); color: var(--red); }
  .btn.btn-elim { font-size: 0.7rem; }
  .btn.btn-elim:hover { border-color: var(--red); color: var(--red); }
  .btn.btn-elim.is-elim { background: rgba(239,68,68,0.2); border-color: var(--red); color: var(--red); }

  .team-pts { font-weight: 700; font-size: 0.85rem; width: 32px; text-align: right; flex-shrink: 0; color: var(--green); }
  .team-pts.zero { color: var(--text2); }

  .add-section { padding: 10px 20px 14px; border-top: 1px solid var(--card-border); }
  .add-btn { background: none; border: 1px dashed var(--card-border); border-radius: 8px; color: var(--text2); padding: 8px; width: 100%; cursor: pointer; font-size: 0.82rem; transition: all 0.15s; }
  .add-btn:hover { border-color: var(--orange); color: var(--orange); }
  .add-form { display: none; gap: 8px; margin-top: 8px; }
  .add-form.show { display: flex; }
  .add-form input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 0.85rem; outline: none; }
  .add-form input:focus { border-color: var(--orange); }
  .add-form input[type="number"] { width: 60px; flex: none; }
  .add-form button { background: var(--orange); border: none; border-radius: 6px; color: #fff; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  .add-form button:hover { filter: brightness(1.1); }

  .add-player-card { background: transparent; border: 2px dashed var(--card-border); border-radius: 16px; display: flex; align-items: center; justify-content: center; min-height: 200px; cursor: pointer; transition: all 0.2s; flex-direction: column; gap: 8px; color: var(--text2); }
  .add-player-card:hover { border-color: var(--orange); color: var(--orange); }
  .add-player-card .plus { font-size: 2rem; }
  .add-player-card span { font-size: 0.9rem; }
  .add-player-form { display: none; background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; flex-direction: column; gap: 10px; min-height: 200px; }
  .add-player-form.show { display: flex; }
  .add-player-form h3 { font-size: 1rem; margin-bottom: 4px; }
  .add-player-form input { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); border-radius: 6px; padding: 10px 12px; color: var(--text); font-size: 0.9rem; outline: none; }
  .add-player-form input:focus { border-color: var(--orange); }
  .add-player-form .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  .add-player-form button { border: none; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  .add-player-form .btn-create { background: var(--orange); color: #fff; }
  .add-player-form .btn-cancel { background: rgba(255,255,255,0.1); color: var(--text2); }

  .btn-remove { width: 20px; height: 20px; border-radius: 4px; border: none; background: transparent; color: var(--text2); font-size: 0.7rem; cursor: pointer; display: none; align-items: center; justify-content: center; flex-shrink: 0; }
  .team-row:hover .btn-remove { display: flex; }
  .btn-remove:hover { color: var(--red); background: rgba(239,68,68,0.1); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1e293b; border: 1px solid var(--card-border); color: var(--text); padding: 12px 24px; border-radius: 10px; font-size: 0.85rem; opacity: 0; transition: all 0.3s ease; z-index: 100; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    body { padding: 12px; }
    .header h1 { font-size: 1.5rem; }
    .players-grid { grid-template-columns: 1fr; }
    .rules { font-size: 0.72rem; gap: 6px; }
    .rule-chip { padding: 4px 10px; }
    .team-row { padding: 8px 14px; }
    .lb-name { width: 55px; font-size: 0.85rem; }
    .live-games-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>
</head>
<body>

<div class="header">
  <h1>MARCH MADNESS 2026</h1>
  <div class="subtitle">Bracket Challenge Scoring Tracker</div>
</div>

<div class="rules">
  <div class="rule-chip">Seeds <b>1-4</b>: 1 pt/win</div>
  <div class="rule-chip">Seeds <b>5-9</b>: 2 pts/win</div>
  <div class="rule-chip">Seeds <b>10-12</b>: 3 pts/win</div>
  <div class="rule-chip">Seeds <b>13-16</b>: 4 pts/win</div>
  <div class="rule-chip">Final Four win: <b>+2</b></div>
  <div class="rule-chip">Championship win: <b>+4</b></div>
  <div class="rule-chip" style="color:var(--text2);font-style:italic">Play-in games excluded</div>
</div>

<div class="sync-bar">
  <button class="sync-btn" id="sync-btn" onclick="syncResults()">
    <span class="sync-icon">&#8635;</span> Sync Live Results
  </button>
  <div class="sync-status" id="sync-status"></div>
  <button class="reset-btn" onclick="resetAll()">Reset All</button>
</div>

<div class="leaderboard" id="leaderboard"></div>
<div class="round-scoreboard" id="round-scoreboard"></div>
<div class="live-section" id="live-section" style="display:none"></div>
<div class="players-grid" id="players-grid"></div>
<div class="toast" id="toast"></div>

<script>
// ── Constants ────────────────────────────────────────────────────
const ROUND_ORDER = ['R64','R32','S16','E8','F4','Champ'];
const ROUND_FULL  = ['Round of 64','Round of 32','Sweet 16','Elite 8','Final Four','Championship'];

// First Four dates excluded; scoring starts at Round of 64
const FIRST_FOUR_DATES = ['20260317','20260318'];
const ROUND_DATE_MAP = {
  '20260319':'R64','20260320':'R64',
  '20260321':'R32','20260322':'R32',
  '20260326':'S16','20260327':'S16',
  '20260328':'E8', '20260329':'E8',
  '20260404':'F4',
  '20260406':'Champ',
};

const DEFAULT_PLAYERS = {
  JON: [
    { team: "BYU Cougars", seed: 6 },
    { team: "St. John's", seed: 5 },
    { team: "Vanderbilt Commodores", seed: 5 },
    { team: "Louisville Cardinals", seed: 6 },
    { team: "Tennessee Volunteers", seed: 6 },
    { team: "Utah State Aggies", seed: 9 },
    { team: "High Point Panthers", seed: 12 },
    { team: "Ohio State Buckeyes", seed: 8 },
    { team: "Georgia Bulldogs", seed: 8 },
    { team: "North Dakota State Bison", seed: 14 },
    { team: "California Baptist Lancers", seed: 13 },
    { team: "Tennessee State Tigers", seed: 15 },
  ],
  KYLE: [
    { team: "Duke Blue Devils", seed: 1 },
    { team: "UConn Huskies", seed: 2 },
    { team: "Alabama Crimson Tide", seed: 4 },
    { team: "Virginia Cavaliers", seed: 3 },
    { team: "USF Bulls", seed: 11 },
    { team: "Saint Louis Billikens", seed: 9 },
    { team: "Saint Mary's Gaels", seed: 7 },
    { team: "Clemson Tigers", seed: 8 },
    { team: "TCU Horned Frogs", seed: 9 },
    { team: "Texas A&M Aggies", seed: 10 },
    { team: "Penn Quakers", seed: 14 },
    { team: "Northern Iowa Panthers", seed: 12 },
  ],
  ADAM: [
    { team: "Florida Gators", seed: 1 },
    { team: "Purdue Boilermakers", seed: 2 },
    { team: "Arkansas Razorbacks", seed: 4 },
    { team: "Michigan State Spartans", seed: 3 },
    { team: "UCLA Bruins", seed: 7 },
    { team: "Santa Clara Broncos", seed: 10 },
    { team: "VCU Rams", seed: 11 },
    { team: "Akron Zips", seed: 12 },
    { team: "Villanova Wildcats", seed: 8 },
    { team: "Miami (OH) RedHawks", seed: 11 },
    { team: "Troy Trojans", seed: 13 },
    { team: "Siena Saints", seed: 16 },
  ],
  DAVID: [
    { team: "Michigan Wolverines", seed: 1 },
    { team: "Houston Cougars", seed: 2 },
    { team: "Gonzaga Bulldogs", seed: 3 },
    { team: "Kansas Jayhawks", seed: 4 },
    { team: "Nebraska Cornhuskers", seed: 4 },
    { team: "North Carolina Tar Heels", seed: 6 },
    { team: "Kentucky Wildcats", seed: 7 },
    { team: "Iowa Hawkeyes", seed: 9 },
    { team: "UCF Knights", seed: 10 },
    { team: "Hawai'i Rainbow Warriors", seed: 13 },
    { team: "Wright State Raiders", seed: 14 },
    { team: "Kennesaw State Owls", seed: 15 },
  ],
  GREG: [
    { team: "Arizona Wildcats", seed: 1 },
    { team: "Iowa State Cyclones", seed: 2 },
    { team: "Illinois Fighting Illini", seed: 3 },
    { team: "Wisconsin Badgers", seed: 5 },
    { team: "Texas Tech Red Raiders", seed: 5 },
    { team: "Texas Longhorns", seed: 11 },
    { team: "Miami Hurricanes", seed: 7 },
    { team: "Missouri Tigers", seed: 10 },
    { team: "Hofstra Pride", seed: 13 },
    { team: "McNeese Cowboys", seed: 12 },
    { team: "Furman Paladins", seed: 15 },
    { team: "Howard Bison", seed: 16 },
  ],
};

const PLAYER_COLORS = ['#ff6b35','#3b82f6','#4ade80','#c084fc','#f472b6','#facc15','#22d3ee','#fb923c'];

// ── State ────────────────────────────────────────────────────────
let state = loadState();
let liveGames = [];
let liveTimer = null;

function loadState() {
  try {
    const saved = localStorage.getItem('mm2026_v3');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return initState();
}

function initState() {
  const s = { players: {}, order: [] };
  for (const [name, teams] of Object.entries(DEFAULT_PLAYERS)) {
    s.order.push(name);
    s.players[name] = teams.map(t => ({ ...t, wins: 0, eliminated: false }));
  }
  return s;
}

function saveState() {
  localStorage.setItem('mm2026_v3', JSON.stringify(state));
}

// ── Scoring ──────────────────────────────────────────────────────
function ptsPerWin(seed) {
  if (seed <= 4) return 1;
  if (seed <= 9) return 2;
  if (seed <= 12) return 3;
  return 4;
}

function teamScore(t) {
  let pts = 0;
  const base = ptsPerWin(t.seed);
  for (let w = 0; w < t.wins; w++) {
    pts += base;
    if (w === 4) pts += 2;
    if (w === 5) pts += 4;
  }
  return pts;
}

function playerScore(name) {
  return (state.players[name] || []).reduce((sum, t) => sum + teamScore(t), 0);
}

// Per-round score: points earned IN a specific round
// roundIdx: 0=R64, 1=R32, 2=S16, 3=E8, 4=F4, 5=Champ
function playerRoundScore(name, roundIdx) {
  return (state.players[name] || []).reduce((sum, t) => {
    if (t.wins > roundIdx) {
      let pts = ptsPerWin(t.seed);
      if (roundIdx === 4) pts += 2;
      if (roundIdx === 5) pts += 4;
      return sum + pts;
    }
    return sum;
  }, 0);
}

function maxPossibleScore(name) {
  return (state.players[name] || []).reduce((sum, t) => {
    if (t.eliminated) return sum + teamScore(t);
    const base = ptsPerWin(t.seed);
    let pts = 0;
    for (let w = 0; w < 6; w++) { pts += base; if (w === 4) pts += 2; if (w === 5) pts += 4; }
    return sum + pts;
  }, 0);
}

// ── Round Labels ─────────────────────────────────────────────────
const ROUND_LABELS = ['—', 'R32', 'S16', 'E8', 'F4', 'Final', 'Champ'];

function roundLabel(wins, eliminated) {
  if (eliminated && wins === 0) return 'Out R64';
  if (eliminated) return 'Out ' + ROUND_LABELS[wins];
  if (wins === 6) return 'Champ';
  if (wins === 0) return '—';
  return ROUND_LABELS[wins];
}

function seedClass(seed) {
  if (seed <= 4) return 'seed-1-4';
  if (seed <= 9) return 'seed-5-9';
  if (seed <= 12) return 'seed-10-12';
  return 'seed-13-16';
}

// ── Pick Lookup (for live games) ─────────────────────────────────
function getPickedBy(teamName) {
  const owners = [];
  for (const p of state.order) {
    for (const t of state.players[p]) {
      if (matchTeamName(teamName, [t.team])) { owners.push(p); break; }
    }
  }
  return owners;
}

// ── Rendering ────────────────────────────────────────────────────
function render() {
  renderLeaderboard();
  renderRoundScoreboard();
  renderPlayers();
  renderLiveGames();
  saveState();
}

function renderLeaderboard() {
  const el = document.getElementById('leaderboard');
  const sorted = [...state.order].sort((a, b) => playerScore(b) - playerScore(a));
  const maxPts = Math.max(...sorted.map(n => playerScore(n)), 1);

  let html = '<h2>Leaderboard</h2>';
  sorted.forEach((name, i) => {
    const score = playerScore(name);
    const pct = (score / maxPts) * 100;
    const colorIdx = state.order.indexOf(name) % PLAYER_COLORS.length;
    const color = PLAYER_COLORS[colorIdx];
    const rankClass = i === 0 ? 'first' : i === 1 ? 'second' : i === 2 ? 'third' : '';
    html += `
      <div class="lb-row">
        <div class="lb-rank ${rankClass}">${i + 1}</div>
        <div class="lb-name" style="color:${color}">${name}</div>
        <div class="lb-bar-wrap">
          <div class="lb-bar" style="width:${Math.max(pct, 2)}%;background:${color}"></div>
        </div>
        <div class="lb-score">${score} <span style="font-size:0.7rem;color:var(--text2)">pts</span></div>
      </div>`;
  });
  el.innerHTML = html;
}

function renderRoundScoreboard() {
  const el = document.getElementById('round-scoreboard');
  const sorted = [...state.order].sort((a, b) => playerScore(b) - playerScore(a));

  // Determine current round (latest round with any points)
  let currentRound = -1;
  for (let r = ROUND_ORDER.length - 1; r >= 0; r--) {
    if (sorted.some(n => playerRoundScore(n, r) > 0)) { currentRound = r; break; }
  }

  let html = '<h2>Score by Round</h2>';
  html += '<table class="round-table"><thead><tr><th></th>';
  ROUND_ORDER.forEach((r, i) => {
    const isCurrent = i === currentRound;
    html += `<th class="${isCurrent ? 'current-round' : ''}">${r}</th>`;
  });
  html += '<th>TOTAL</th></tr></thead><tbody>';

  sorted.forEach((name, pi) => {
    const colorIdx = state.order.indexOf(name) % PLAYER_COLORS.length;
    const color = PLAYER_COLORS[colorIdx];
    const total = playerScore(name);
    html += `<tr><td style="color:${color}">${name}</td>`;
    ROUND_ORDER.forEach((r, ri) => {
      const pts = playerRoundScore(name, ri);
      const isCurrent = ri === currentRound;
      const cls = pts > 0 ? 'has-pts' : 'no-pts';
      html += `<td class="${cls} ${isCurrent ? 'current-round' : ''}">${pts > 0 ? pts : '–'}</td>`;
    });
    html += `<td class="total-col">${total}</td></tr>`;
  });

  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderLiveGames() {
  const el = document.getElementById('live-section');
  if (!liveGames || liveGames.length === 0) {
    el.style.display = 'none';
    return;
  }

  el.style.display = '';
  const inProgress = liveGames.filter(g => g.status === 'in_progress');
  const completed = liveGames.filter(g => g.status === 'final');
  const scheduled = liveGames.filter(g => g.status === 'scheduled');

  const pulseClass = inProgress.length > 0 ? '' : completed.length > 0 ? 'done' : 'scheduled';
  const headerText = inProgress.length > 0 ? "Today's Games" : completed.length > 0 ? "Today's Results" : "Upcoming Games";

  let html = `<div class="live-header"><div class="live-pulse ${pulseClass}"></div><h2>${headerText}</h2></div>`;
  html += '<div class="live-games-grid">';

  // Show in-progress first, then scheduled, then completed
  const ordered = [...inProgress, ...scheduled, ...completed];

  for (const g of ordered) {
    const gameClass = g.status === 'in_progress' ? 'in-progress' : g.status === 'final' ? 'final' : '';
    html += `<div class="live-game ${gameClass}">`;
    html += `<div class="live-game-round">${g.round || 'NCAA Tournament'}</div>`;

    for (const team of g.teams) {
      const picked = getPickedBy(team.name);
      const isPicked = picked.length > 0;
      const isWinner = g.status === 'final' && team.winner;
      const nameClass = isWinner ? 'winner' : isPicked ? 'picked' : '';
      const ownerTag = isPicked ? ` <span class="live-owner">(${picked.join(', ')})</span>` : '';
      html += `<div class="live-team-row">
        <div class="live-seed">${team.seed || ''}</div>
        <div class="live-team-name ${nameClass}">${team.shortName || team.name}${ownerTag}</div>
        <div class="live-score">${team.score ?? ''}</div>
      </div>`;
    }

    // Status line
    if (g.status === 'in_progress') {
      html += `<div class="live-game-status live">${g.clock || ''} ${g.period || ''}</div>`;
    } else if (g.status === 'final') {
      html += `<div class="live-game-status done">Final</div>`;
    } else {
      html += `<div class="live-game-status sched">${g.startTime || 'TBD'}</div>`;
    }

    html += '</div>';
  }

  html += '</div>';
  el.innerHTML = html;
}

function renderPlayers() {
  const grid = document.getElementById('players-grid');
  let html = '';

  state.order.forEach((name, pi) => {
    const teams = state.players[name];
    const score = playerScore(name);
    const maxPoss = maxPossibleScore(name);
    const colorIdx = pi % PLAYER_COLORS.length;
    const color = PLAYER_COLORS[colorIdx];
    const teamCount = teams.length;

    html += `<div class="player-card">
      <div class="player-header">
        <div class="player-name" style="color:${color}">${name}</div>
        <div class="player-score">${score} <span>pts</span></div>
      </div>
      <div class="player-meta">${teamCount}/12 picks &nbsp;|&nbsp; Max possible: ${maxPoss} pts</div>
      <div class="player-rounds">`;

    ROUND_ORDER.forEach((r, ri) => {
      const pts = playerRoundScore(name, ri);
      const cls = pts > 0 ? 'has-pts' : '';
      html += `<div class="player-round-chip ${cls}">${r}: <b>${pts}</b></div>`;
    });

    html += `</div><div class="team-list">`;

    teams.forEach((t, ti) => {
      const sc = teamScore(t);
      const rl = roundLabel(t.wins, t.eliminated);
      const elimClass = t.eliminated ? ' eliminated' : '';
      const champClass = t.wins === 6 ? ' champion' : '';
      const rlClass = t.wins > 0 && !t.eliminated ? (t.wins === 6 ? 'champion' : 'advanced') : '';

      html += `
        <div class="team-row${elimClass}${champClass}">
          <div class="seed-badge ${seedClass(t.seed)}">${t.seed}</div>
          <div class="team-name">${t.team}</div>
          <div class="round-label ${rlClass}">${rl}</div>
          <div class="team-controls">
            <button class="btn btn-sub" onclick="changeWins('${name}',${ti},-1)" title="Remove win">−</button>
            <button class="btn btn-add" onclick="changeWins('${name}',${ti},1)" title="Add win">+</button>
            <button class="btn btn-elim ${t.eliminated ? 'is-elim' : ''}" onclick="toggleElim('${name}',${ti})" title="Toggle eliminated">✕</button>
          </div>
          <div class="team-pts ${sc === 0 ? 'zero' : ''}">${sc}</div>
          <button class="btn-remove" onclick="removeTeam('${name}',${ti})" title="Remove team">🗑</button>
        </div>`;
    });

    html += `</div>
      <div class="add-section">
        <button class="add-btn" onclick="showAddTeam('${name}')">+ Add Team</button>
        <div class="add-form" id="add-form-${name}">
          <input type="text" id="team-name-${name}" placeholder="Team name" onkeydown="if(event.key==='Enter')addTeam('${name}')">
          <input type="number" id="team-seed-${name}" placeholder="#" min="1" max="16" onkeydown="if(event.key==='Enter')addTeam('${name}')">
          <button onclick="addTeam('${name}')">Add</button>
        </div>
      </div>
    </div>`;
  });

  html += `
    <div class="add-player-card" id="add-player-trigger" onclick="showAddPlayer()">
      <div class="plus">+</div><span>Add Player</span>
    </div>
    <div class="add-player-form" id="add-player-form">
      <h3>New Player</h3>
      <input type="text" id="new-player-name" placeholder="Player name" onkeydown="if(event.key==='Enter')addPlayer()">
      <div class="form-actions">
        <button class="btn-create" onclick="addPlayer()">Create</button>
        <button class="btn-cancel" onclick="hideAddPlayer()">Cancel</button>
      </div>
    </div>`;

  grid.innerHTML = html;
}

// ── Actions ──────────────────────────────────────────────────────
function changeWins(player, teamIdx, delta) {
  const t = state.players[player][teamIdx];
  const nw = t.wins + delta;
  if (nw < 0 || nw > 6) return;
  t.wins = nw;
  if (nw > 0) t.eliminated = false;
  render();
}

function toggleElim(player, teamIdx) {
  const t = state.players[player][teamIdx];
  t.eliminated = !t.eliminated;
  render();
}

function removeTeam(player, teamIdx) {
  state.players[player].splice(teamIdx, 1);
  render();
  showToast('Team removed');
}

function showAddTeam(player) {
  const form = document.getElementById('add-form-' + player);
  form.classList.toggle('show');
  if (form.classList.contains('show')) document.getElementById('team-name-' + player).focus();
}

function addTeam(player) {
  const nameEl = document.getElementById('team-name-' + player);
  const seedEl = document.getElementById('team-seed-' + player);
  const name = nameEl.value.trim();
  const seed = parseInt(seedEl.value);
  if (!name) { nameEl.focus(); return; }
  if (!seed || seed < 1 || seed > 16) { seedEl.focus(); return; }
  state.players[player].push({ team: name, seed, wins: 0, eliminated: false });
  nameEl.value = ''; seedEl.value = '';
  document.getElementById('add-form-' + player).classList.remove('show');
  render();
  showToast(`${name} added to ${player}`);
}

function showAddPlayer() {
  document.getElementById('add-player-trigger').style.display = 'none';
  document.getElementById('add-player-form').classList.add('show');
  document.getElementById('new-player-name').focus();
}

function hideAddPlayer() {
  document.getElementById('add-player-trigger').style.display = '';
  document.getElementById('add-player-form').classList.remove('show');
}

function addPlayer() {
  const el = document.getElementById('new-player-name');
  const name = el.value.trim().toUpperCase();
  if (!name) { el.focus(); return; }
  if (state.players[name]) { showToast('Player already exists'); return; }
  state.order.push(name);
  state.players[name] = [];
  el.value = '';
  hideAddPlayer();
  render();
  showToast(`${name} added!`);
}

function resetAll() {
  if (confirm('Reset all scores and picks to defaults?')) {
    localStorage.removeItem('mm2026_v3');
    state = initState();
    render();
    showToast('Reset complete');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── ESPN API ─────────────────────────────────────────────────────
const ESPN_BASE = 'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard';

const NAME_ALIASES = {
  'usf': ['south florida', 'usf'],
  'uconn': ['connecticut', 'uconn'],
  'byu': ['brigham young', 'byu'],
  'lsu': ['louisiana state', 'lsu'],
  'smu': ['southern methodist', 'smu'],
  'ole miss': ['mississippi', 'ole miss'],
  'ucf': ['central florida', 'ucf'],
};

function normalizeTeamName(name) {
  return name.toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
}

function matchTeamName(pickName, espnNames) {
  const pick = normalizeTeamName(pickName);
  for (const en of espnNames) { if (normalizeTeamName(en) === pick) return en; }
  for (const en of espnNames) { const ne = normalizeTeamName(en); if (ne.includes(pick) || pick.includes(ne)) return en; }
  const pickWords = pick.split(' ');
  for (let wc = Math.min(pickWords.length, 2); wc >= 1; wc--) {
    const prefix = pickWords.slice(0, wc).join(' ');
    if (prefix.length < 3) continue;
    for (const en of espnNames) { if (normalizeTeamName(en).startsWith(prefix)) return en; }
  }
  for (const [alias, variants] of Object.entries(NAME_ALIASES)) {
    if (pick.includes(alias)) {
      for (const v of variants) { for (const en of espnNames) { if (normalizeTeamName(en).includes(v)) return en; } }
    }
  }
  return null;
}

function getScoringDates() {
  // Only dates from R64 onwards (skip First Four)
  const dates = [];
  const start = new Date(2026, 2, 19); // March 19 = R64 start
  const end = new Date(2026, 3, 8);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    dates.push(`${y}${m}${day}`);
  }
  const today = new Date();
  const todayStr = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  return dates.filter(d => d <= todayStr);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

function dateToRound(dateStr) {
  return ROUND_DATE_MAP[dateStr] || 'NCAA';
}

async function fetchDayGames(date) {
  const url = `${ESPN_BASE}?dates=${date}&groups=100&limit=50`;
  const resp = await fetch(url);
  if (!resp.ok) return [];
  const data = await resp.json();
  return data.events || [];
}

// ── Sync Scores (completed games, skip First Four) ──────────────
async function syncResults() {
  const btn = document.getElementById('sync-btn');
  const statusEl = document.getElementById('sync-status');
  btn.classList.add('loading');
  statusEl.innerHTML = 'Fetching tournament results...';

  try {
    const dates = getScoringDates();
    if (dates.length === 0) {
      statusEl.innerHTML = '<span class="error-info">Round of 64 hasn\'t started yet</span>';
      btn.classList.remove('loading');
      // Still fetch live games for today
      await fetchLiveGames();
      renderLiveGames();
      return;
    }

    const teamWins = {};
    const teamLost = {};
    let totalGames = 0;

    for (let i = 0; i < dates.length; i += 5) {
      const batch = dates.slice(i, i + 5);
      const results = await Promise.all(batch.map(d => fetchDayGames(d).catch(() => [])));
      for (const events of results) {
        for (const event of events) {
          const comp = event.competitions?.[0];
          if (!comp?.status?.type?.completed) continue;
          totalGames++;
          for (const c of comp.competitors) {
            const name = c.team?.displayName || c.team?.shortDisplayName || c.team?.name || '';
            if (!name) continue;
            if (c.winner) { teamWins[name] = (teamWins[name] || 0) + 1; }
            else { teamLost[name] = true; }
          }
        }
      }
    }

    const allEspnNames = [...new Set([...Object.keys(teamWins), ...Object.keys(teamLost)])];
    let updates = 0, matched = 0, notYetPlayed = 0;

    for (const player of state.order) {
      for (const team of state.players[player]) {
        const espnName = matchTeamName(team.team, allEspnNames);
        if (espnName) {
          matched++;
          const wins = teamWins[espnName] || 0;
          const lost = !!teamLost[espnName];
          if (team.wins !== wins) { team.wins = wins; updates++; }
          team.eliminated = lost;
        } else { notYetPlayed++; }
      }
    }

    state.lastSync = new Date().toISOString();

    // Also fetch live games
    await fetchLiveGames();

    render();

    const syncTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    let statusMsg = `<span class="match-info">${totalGames} games synced</span> | ${matched} teams matched | ${updates} updated`;
    if (notYetPlayed > 0) statusMsg += ` | ${notYetPlayed} awaiting tipoff`;
    statusMsg += ` | ${syncTime}`;
    statusEl.innerHTML = statusMsg;
    showToast(`Synced! ${updates} score${updates !== 1 ? 's' : ''} updated`);
  } catch(e) {
    console.error('Sync failed:', e);
    statusEl.innerHTML = `<span class="error-info">Sync failed: ${e.message}. You can still score manually.</span>`;
  }
  btn.classList.remove('loading');
}

// ── Live Games (today's scoreboard) ─────────────────────────────
async function fetchLiveGames() {
  try {
    const today = todayStr();
    const events = await fetchDayGames(today);
    const isFirstFour = FIRST_FOUR_DATES.includes(today);
    const round = dateToRound(today);

    liveGames = events.map(event => {
      const comp = event.competitions?.[0];
      if (!comp) return null;

      const statusType = comp.status?.type?.name || '';
      let status = 'scheduled';
      if (statusType === 'STATUS_FINAL' || comp.status?.type?.completed) status = 'final';
      else if (statusType === 'STATUS_IN_PROGRESS' || statusType === 'STATUS_HALFTIME') status = 'in_progress';

      const clock = comp.status?.displayClock || '';
      const period = comp.status?.period ? (comp.status.period === 1 ? '1st Half' : comp.status.period === 2 ? '2nd Half' : `OT${comp.status.period > 3 ? comp.status.period - 2 : ''}`) : '';
      const startDate = new Date(event.date);
      const startTime = startDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

      const teams = (comp.competitors || []).map(c => ({
        name: c.team?.displayName || c.team?.name || '',
        shortName: c.team?.shortDisplayName || c.team?.displayName || '',
        seed: c.curatedRank?.current || c.team?.seed || '',
        score: c.score || '',
        winner: !!c.winner,
      }));

      return {
        round: isFirstFour ? 'First Four (no pts)' : (ROUND_FULL[ROUND_ORDER.indexOf(round)] || 'NCAA Tournament'),
        status, clock, period, startTime, teams,
      };
    }).filter(Boolean);

    // Start/stop auto-refresh based on live games
    const hasLive = liveGames.some(g => g.status === 'in_progress');
    if (hasLive && !liveTimer) {
      liveTimer = setInterval(async () => {
        await fetchLiveGames();
        renderLiveGames();
      }, 30000);
    } else if (!hasLive && liveTimer) {
      clearInterval(liveTimer);
      liveTimer = null;
    }
  } catch(e) {
    console.warn('Live games fetch failed:', e);
  }
}

function renderSyncStatus() {
  if (state.lastSync) {
    const d = new Date(state.lastSync);
    document.getElementById('sync-status').textContent =
      `Last synced: ${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  }
}

// ── Init ─────────────────────────────────────────────────────────
render();
renderSyncStatus();
// Fetch live games on load
fetchLiveGames().then(() => renderLiveGames());
</script>
