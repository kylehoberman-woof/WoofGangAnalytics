name: Nightly Update
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          token: ${{ secrets.PAT_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install httpx pandas openpyxl
      - name: Run dashboard script
        env:
          FRANPOS_TOKEN: ${{ secrets.FRANPOS_TOKEN }}
        run: |
          find . -name "*.pyc" -delete
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          cd scripts && python run.py
      - name: Rebuild commission dashboard
        run: python3 scripts/build_commission_dashboard.py
      - name: Fetch stock levels
        env:
          FRANPOS_TOKEN: ${{ secrets.FRANPOS_TOKEN }}
        run: python3 scripts/fetch_stock.py
      - name: Generate inventory dashboard
        run: cd scripts && python generate_inventory_dashboard.py
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/update.yml
          git add port-washington/data/
          git add port-washington/*.html
          git diff --staged --quiet || git commit -m "Auto-update dashboards $(date +'%Y-%m-%d')"
          # Pull latest main first, then re-generate would be ideal but
          # for conflicts in generated HTML, just accept our freshly built version
          git pull --rebase origin main || {
            git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
            git diff --name-only --diff-filter=U | xargs -r git add
            GIT_EDITOR=true git rebase --continue
          }
          git push origin HEAD:main
