name: Nightly Update
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          token: ${{ secrets.PAT_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install httpx pandas openpyxl
      - name: Run dashboard script
        env:
          FRANPOS_TOKEN: ${{ secrets.FRANPOS_TOKEN }}
        run: |
          find . -name "*.pyc" -delete
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          cd scripts && python run.py
      - name: Fetch stock levels
        env:
          FRANPOS_TOKEN: ${{ secrets.FRANPOS_TOKEN }}
        run: |
          python3 -c "
import httpx, json, time, os
from pathlib import Path
TOKEN = os.environ['FRANPOS_TOKEN']
BASE_URL = 'https://publicapi.franpos.com'
LOCATION_ID = 203698
data_dir = Path('port-washington/data')
all_data = json.load(open(data_dir / 'all_data.json'))
skus = set(i.get('Sku','').strip() for i in all_data['order_items'] if len(i.get('Sku','').strip()) > 2)
stock = {}
for sku in sorted(skus):
    try:
        r = httpx.get(f'{BASE_URL}/api/getStockByProductSKU/{sku}/{LOCATION_ID}', params={'Token': TOKEN}, timeout=10)
        if r.status_code == 200:
            stock[sku] = float(r.text.strip())
        time.sleep(0.05)
    except: pass
json.dump(stock, open(data_dir / 'stock_levels.json', 'w'))
print(f'Fetched {len(stock)} stock levels')
"
      - name: Generate inventory dashboard
        run: cd scripts && python generate_inventory_dashboard.py
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add port-washington/data/
          git add port-washington/*.html
          git diff --staged --quiet || git commit -m "Auto-update dashboards $(date +'%Y-%m-%d')"
          git push --force origin HEAD:main
