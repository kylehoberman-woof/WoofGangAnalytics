name: Refetch Pet Visits
on:
  workflow_dispatch:
permissions:
  contents: write

# Standalone re-fetch of pet_visits.json (scripts/fetch_pet_visits.py) without
# the full nightly pipeline. Reuses the already-committed customer_names.json
# and all_data.json for the price join, so this only needs the per-pet
# customer-history API calls — much faster than a full run.

jobs:
  refetch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        store: [port-washington, hicksville]
      fail-fast: false
    env:
      FRANPOS_TOKEN: ${{ secrets.FRANPOS_TOKEN }}
      FRANPOS_TOKEN_PW: ${{ secrets.FRANPOS_TOKEN }}
      FRANPOS_TOKEN_HV: ${{ secrets.FRANPOS_TOKEN_HV }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          token: ${{ secrets.PAT_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install httpx requests

      - name: ${{ matrix.store }} - Refetch pet visits
        run: python3 scripts/fetch_pet_visits.py ${{ matrix.store }}

      - name: ${{ matrix.store }} - Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/update.yml .github/workflows/discover.yml .github/workflows/refetch-pets.yml
          git add -A
          git diff --staged --quiet || git commit -m "Refetch pet visits (with Type field): ${{ matrix.store }} $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin main || {
            git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
            git diff --name-only --diff-filter=U | xargs -r git add
            GIT_EDITOR=true git rebase --continue
          }
          git push origin HEAD:main
